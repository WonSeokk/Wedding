    <!-- Firebase SDK for Like Counter -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
        import { getDatabase, ref, get, runTransaction } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCo7Rlk1cFF4GYoQ77IX4LlnuikLk1BqMM",
            authDomain: "wedding-eb136.firebaseapp.com",
            databaseURL: "https://wedding-eb136-default-rtdb.firebaseio.com",
            projectId: "wedding-eb136",
            storageBucket: "wedding-eb136.firebasestorage.app",
            messagingSenderId: "1062632256733",
            appId: "1:1062632256733:web:455ad524d58f9205e2d734",
            measurementId: "G-V4P5QL75PK"
          };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // 좋아요 카운트 증가
        window.incrementLike = async (type) => {
            try {
                const likeRef = ref(database, `likes/${type}`);
                await runTransaction(likeRef, (currentCount) => {
                    return (currentCount || 0) + 1;
                });
                return true;
            } catch (error) {
                console.error('Like increment error:', error);
                return false;
            }
        };

        // 좋아요 카운트 읽기
        window.getLikeCount = async (type) => {
            try {
                const likeRef = ref(database, `likes/${type}`);
                const snapshot = await get(likeRef);
                if (snapshot.exists()) {
                    console.log("No data available for snapshot:", snapshot.val());
                    return snapshot.val();
                } else {
                    console.log("No data available for type:", type);
                    return 0; // Return 0 if no data
                }
            } catch (error) {
                console.error('Like count read error:', error);
                return 0;
            }
        };

        window.incrementDailyVisit = async () => {
            try {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const dateString = `${year}-${month}-${day}`;

                const visitCountRef = ref(database, `visits/${dateString}/count`);

                await runTransaction(visitCountRef, (currentCount) => {
                    return (currentCount || 0) + 1;
                });
                return true;
            } catch (error) {
                console.error('Daily visit increment error:', error);
                return false;
            }
        };

        console.log('Firebase Like Counter initialized');
    </script>

    <script type="text/javascript">
        var weddingMap = null;
        var isMapVisible = false;
        var lastKnownMapPosition = 0;
        
        // WASM 모듈 상태 관리
        var wasmState = {
            isLoading: false,
            isReady: false,
            initRetryCount: 0,
            maxRetries: 3
        };

        // WASM 초기화 대기 및 재시도 메커니즘
        function waitForWasm(callback, timeout = 10000) {
            var startTime = Date.now();
            
            function checkWasm() {
                // WASM이 이미 준비되었는지 확인
                if (wasmState.isReady || (window.wasmExports && typeof window.wasmExports === 'object')) {
                    wasmState.isReady = true;
                    callback(true);
                    return;
                }
                
                // 타임아웃 체크
                if (Date.now() - startTime > timeout) {
                    console.warn('WASM 초기화 타임아웃');
                    callback(false);
                    return;
                }
                
                // 100ms 후 다시 체크
                setTimeout(checkWasm, 100);
            }
            
            checkWasm();
        }

        // 안전한 WASM 함수 호출
        function safeWasmCall(func, ...args) {
            if (!wasmState.isReady) {
                console.warn('WASM not ready, deferring call to:', func.name || 'anonymous');
                return null;
            }
            
            try {
                return func(...args);
            } catch (error) {
                console.error('WASM call failed:', error);
                // WASM 호출 실패시 재초기화 시도
                if (wasmState.initRetryCount < wasmState.maxRetries) {
                    wasmState.initRetryCount++;
                    wasmState.isReady = false;
                    console.log('WASM 재초기화 시도:', wasmState.initRetryCount);
                }
                return null;
            }
        }

        // Compose App이 준비되면 초기 로딩 화면을 숨기는 함수
        window.hideInitialLoading = function() {
            const loadingScreen = document.getElementById('initial-loading');
            if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                loadingScreen.style.transition = 'opacity 0.5s ease-out';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }
        };

        // 로딩 진행률 업데이트 함수
        window.updateLoadingProgress = function(loaded, total) {
            const progressBar = document.querySelector('.progress-bar');
            const progressText = document.querySelector('.progress-text');

            if (progressBar && progressText) {
                const percentage = Math.round((loaded / total) * 100);
                progressBar.style.width = percentage + '%';
                progressText.textContent = `${percentage}%`;

                // 100% 완료시 특별한 메시지
                if (percentage === 100) {
                    progressText.textContent = '완료! ✨';
                }
            }
        };

        // 에러 처리 함수
        window.handleWasmError = function(error) {
            console.error('WASM Error:', error);
            const loadingText = document.querySelector('.loading-text');
            if (loadingText) {
                loadingText.textContent = '앱을 시작하는 중...';
            }
            
            // 5초 후 강제로 로딩 화면 숨기기
            setTimeout(() => {
                hideInitialLoading();
            }, 5000);
        };

        // 지도 초기화 함수 (원래 버전으로 복원)
        function initNaverMap(elementId, lat, lng, zoom) {
            var mapContainer = document.getElementById(elementId);
            if (!mapContainer) {
                mapContainer = document.createElement('div');
                mapContainer.id = elementId;
                mapContainer.style.position = 'absolute';
                mapContainer.style.width = '300px';
                mapContainer.style.height = '300px';
                mapContainer.style.left = '50%';
                mapContainer.style.transform = 'translateX(-50%)';
                mapContainer.style.zIndex = '999';
                mapContainer.style.display = 'none';
                document.body.appendChild(mapContainer);
            }

            var mapOptions = {
                center: new naver.maps.LatLng(lat, lng),
                zoom: zoom,
                zoomControl: false,
                scaleControl: false
            };

            weddingMap = new naver.maps.Map(mapContainer, mapOptions);

            var marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(lat, lng),
                map: weddingMap
            });

            var infoWindow = new naver.maps.InfoWindow({
                content: '<div style="padding:10px;text-align:center;">MJ컨벤션</div>'
            });

            naver.maps.Event.addListener(marker, 'click', function() {
                infoWindow.open(weddingMap, marker);
            });
        }

        function registerMapBox(elementId) {
            var mapBox = document.getElementById('map-box');
            if (!mapBox) {
                mapBox = document.createElement('div');
                mapBox.id = 'map-box';
                mapBox.style.position = 'absolute';
                mapBox.style.height = '300px';
                mapBox.style.width = '360px';
                mapBox.style.left = '50%';
                mapBox.style.transform = 'translateX(-50%)';
                mapBox.style.visibility = 'hidden';
                document.body.appendChild(mapBox);
            }
        }

        function showNaverMap(elementId, show, positionY) {
            lastKnownMapPosition = positionY;

            var mapContainer = document.getElementById(elementId);
            if (!mapContainer) return;

            mapContainer.style.top = positionY + 'px';

            var mapBox = document.getElementById('map-box');
            if (mapBox) {
                mapBox.style.visibility = show ? 'visible' : 'hidden';
                mapBox.style.top = positionY + 'px';
            }

            checkMapVisibility(show);
        }

        function checkMapVisibility(show) {
            if (!weddingMap) return;

            var mapContainer = document.getElementById('map-container');
            if (!mapContainer) return;
            var mapBox = document.getElementById('map-box');
            if (!mapBox) return;
            mapContainer.style.display = show ? 'block' : 'none';
            mapContainer.style.height = '300px';
            mapContainer.style.width = '360px';

            var rect = mapBox.getBoundingClientRect();
            var windowHeight = window.innerHeight;

            var isVisible = rect.top < windowHeight && rect.bottom > 0;

            setTimeout(function() {
                naver.maps.Event.trigger(weddingMap, 'resize');
            }, 100);
        }

        // 전역 에러 핸들러
        window.addEventListener('error', function(event) {
            console.error('Global error:', event.error);
            if (event.error && event.error.message && event.error.message.includes('wasm')) {
                handleWasmError(event.error);
            }
        });

        window.addEventListener('unhandledrejection', function(event) {
            console.error('Unhandled promise rejection:', event.reason);
            if (event.reason && event.reason.toString().includes('wasm')) {
                handleWasmError(event.reason);
            }
        });
    </script>

<!-- WASM 모듈 초기화 개선 -->
<script>
    // iOS Safari WASM 지원 체크
    function checkWasmSupport() {
        try {
            if (typeof WebAssembly === 'object' && typeof WebAssembly.instantiate === 'function') {
                // 간단한 WASM 모듈로 테스트
                const wasmCode = new Uint8Array([0,97,115,109,1,0,0,0,1,133,128,128,128,0,1,96,0,1,127,3,130,128,128,128,0,1,0,4,132,128,128,128,0,1,112,0,0,5,131,128,128,128,0,1,0,1,6,129,128,128,128,0,0,7,145,128,128,128,0,2,6,109,101,109,111,114,121,2,0,4,109,97,105,110,0,0,10,138,128,128,128,0,1,132,128,128,128,0,0,65,42,11]);
                return WebAssembly.validate(wasmCode);
            }
            return false;
        } catch (e) {
            console.warn('WASM 지원 체크 실패:', e);
            return false;
        }
    }

    // WASM 초기화 진행
    function initializeWasm() {
        const loadingText = document.querySelector('.loading-text');
        
        if (!checkWasmSupport()) {
            console.error('이 브라우저는 WebAssembly를 지원하지 않습니다.');
            if (loadingText) loadingText.textContent = '브라우저 호환성 문제 오류 발생';
            
            // WASM 미지원시 기본 앱이라도 시작
            setTimeout(() => {
                hideInitialLoading();
            }, 3000);
            return;
        }

        if (loadingText) loadingText.textContent = '로딩 중...';
        
        // WASM 로딩 타임아웃 설정 (iOS에서 더 긴 시간 필요)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const timeout = isIOS ? 20000 : 15000; // iOS: 20초, 기타: 15초
        
        const timeoutId = setTimeout(() => {
            console.warn('WASM 로딩 타임아웃');
            if (loadingText) loadingText.textContent = '앱을 시작합니다...';
            wasmState.isReady = true; // 강제로 준비 상태로 설정
            setTimeout(hideInitialLoading, 2000);
        }, timeout);

        // WASM 로딩 상태 모니터링
        function monitorWasmLoading() {
            if (window.wasmExports || (window.kotlin && window.kotlin.root)) {
                clearTimeout(timeoutId);
                wasmState.isReady = true;
                console.log('WASM 모듈이 성공적으로 로드되었습니다.');
                if (loadingText) loadingText.textContent = '초기화 중...';
                return;
            }

            // 100ms마다 체크
            setTimeout(monitorWasmLoading, 100);
        }

        monitorWasmLoading();
    }

    // DOM 로드 완료 후 WASM 초기화 시작
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeWasm);
    } else {
        initializeWasm();
    }
</script>
